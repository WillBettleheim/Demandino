[server]
headless = true
# Security: cap uploads, keep XSRF/CORS protection on, and don't watch files in production.
maxUploadSize = 25
maxMessageSize = 50
enableXsrfProtection = true
enableCORS = true
runOnSave = false

# Don't watch files or evaluate bare expressions on the page in production.
fileWatcherType = "none"

[runner]
magicEnabled = false

[client]
showErrorLinks = false
# Show users a short error message, never source code or stack traces.
showErrorDetails = "type"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

# "Harbor" theme: navy, white and coral. Switch light/dark with the sun/moon toggle in the sidebar.
[theme]
base = "dark"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
baseRadius = "0.9rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
metricValueFontWeight = 700
chartCategoricalColors = ["#E8604C", "#3C82D6", "#16A095", "#BE8A1E", "#C4507E", "#6C9A30"]

[theme.dark]
primaryColor = "#FF7F6E"
backgroundColor = "#0B1730"
secondaryBackgroundColor = "#16264A"
textColor = "#F7F8FB"
borderColor = "#263A63"
linkColor = "#FF9C8E"

[theme.dark.sidebar]
backgroundColor = "#081126"
secondaryBackgroundColor = "#13213F"
borderColor = "#263A63"

[theme.light]
primaryColor = "#C63D28"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF1F7"
textColor = "#0F1E3D"
borderColor = "#D8DEEA"
linkColor = "#B83823"

[theme.light.sidebar]
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#E8ECF4"
borderColor = "#D8DEEA"
