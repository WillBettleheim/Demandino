[server]
headless = true
# Security: cap uploads, keep XSRF/CORS protection on, and don't watch files in production.
maxUploadSize = 25
maxMessageSize = 50
enableXsrfProtection = true
enableCORS = true
runOnSave = false

[client]
# Show users a short error message, never source code or stack traces.
showErrorDetails = "type"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

# "Lagoon" theme: deep-sea dark and a bright, airy light mode. Switch with the sun/moon toggle in the sidebar.
[theme]
base = "dark"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
baseRadius = "0.9rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
metricValueFontWeight = 700
chartCategoricalColors = ["#14B8A6", "#F97350", "#3B82F6", "#F59E0B", "#EC4899", "#8B5CF6", "#22C55E", "#64748B"]

[theme.dark]
primaryColor = "#2DD4BF"
backgroundColor = "#050B12"
secondaryBackgroundColor = "#0D1A26"
textColor = "#E6F1F5"
borderColor = "#17293A"
linkColor = "#5EEAD4"

[theme.dark.sidebar]
backgroundColor = "#07111B"
secondaryBackgroundColor = "#0F1E2C"
borderColor = "#17293A"

[theme.light]
primaryColor = "#0D9488"
backgroundColor = "#F5FAFB"
secondaryBackgroundColor = "#E7F1F3"
textColor = "#0B1F2A"
borderColor = "#D3E3E7"
linkColor = "#0F766E"

[theme.light.sidebar]
backgroundColor = "#EDF6F7"
secondaryBackgroundColor = "#E0EDF0"
borderColor = "#D3E3E7"
