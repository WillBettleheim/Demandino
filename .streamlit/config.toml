[server]
headless = true
# Security: cap uploads, keep XSRF/CORS protection on, and don't watch files in production.
maxUploadSize = 25
maxMessageSize = 50
enableXsrfProtection = true
enableCORS = true
runOnSave = false

[client]
# Show users a short error message, never source code or stack traces.
showErrorDetails = "type"
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

# "Harbor" theme: deep navy dark and a crisp, cool light mode. Switch with the sun/moon toggle in the sidebar.
[theme]
base = "dark"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
baseRadius = "0.9rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
metricValueFontWeight = 700
chartCategoricalColors = ["#2F86E0", "#D4702B", "#16A095", "#BE8A1E", "#D9547F", "#6C9A30"]

[theme.dark]
primaryColor = "#5CA8F5"
backgroundColor = "#0E1520"
secondaryBackgroundColor = "#18222F"
textColor = "#E8EEF4"
borderColor = "#26323F"
linkColor = "#8CC2F8"

[theme.dark.sidebar]
backgroundColor = "#0A1018"
secondaryBackgroundColor = "#151E29"
borderColor = "#26323F"

[theme.light]
primaryColor = "#1D6FCF"
backgroundColor = "#F6F8FA"
secondaryBackgroundColor = "#E9EEF3"
textColor = "#14202E"
borderColor = "#D6DEE6"
linkColor = "#1A63BA"

[theme.light.sidebar]
backgroundColor = "#EEF2F6"
secondaryBackgroundColor = "#E2E8EE"
borderColor = "#D6DEE6"
